name: Custom Windows x64
on:
  push:
    branches: ['feature/**', 'upstream/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: custom-windows-${{ github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  NYATERM_PACKAGE_MANAGER: nyamNyamm2-custom-manual
jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      # One-time source transfer: connector lacks Git write access; remove after bootstrap.
      - name: Materialize reviewed feature source on feature branch
        if: github.ref == 'refs/heads/feature/cluster-managers-sidebar'
        shell: bash
        run: |
          if [ ! -f crates/nyaterm-cluster-commands/src/lib.rs ]; then
            python - <<'PYCODE'
          import base64, zlib, pathlib
          pathlib.Path('cluster-source.patch').write_bytes(zlib.decompress(base64.b64decode('')))
          PYCODE
            git apply --check cluster-source.patch
            git apply cluster-source.patch
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add Cargo.toml Cargo.lock crates examples scripts CUSTOM_BUILD.md
            git commit -m 'feat(desktop): add read-only cluster managers and workspace sidebar controls'
            git push origin HEAD:feature/cluster-managers-sidebar
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: ./.github/actions/setup-rust
        with:
          targets: x86_64-pc-windows-msvc,wasm32-unknown-unknown
          components: rustfmt,clippy
          cache-key: custom-windows
          save-cache: always
          cache-on-failure: 'true'
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Rust policy and integration tests
        run: cargo test --locked -p nyaterm-cluster-commands -p nyaterm-remote-ops -p nyaterm-core -p nyaterm-updater
      - name: Check workspace
        run: cargo check --locked --workspace
      - name: Desktop state and UI tests
        run: cargo test --locked -p nyaterm-desktop --lib
      - name: Build external SDK plugins
        run: python scripts/plugins/build.py
      - name: Install NSIS
        shell: pwsh
        run: ./scripts/ci/install-nsis.ps1
      - name: Prepare bundled ConPTY
        run: python scripts/release/prepare_conpty.py
      - name: Build Windows x64 installer and portable ZIP
        shell: pwsh
        env:
          NYATERM_ARTIFACT_VERSION: 2.0.4-custom.1
        run: python scripts/release/package_native.py x86_64-pc-windows-msvc
      - name: Verify packages
        run: python scripts/release/verify_native_package.py --target x86_64-pc-windows-msvc --version 2.0.4 --artifact-version 2.0.4-custom.1 --dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: NyaTerm-custom-Windows-x64-${{ github.sha }}
          path: |
            dist/*-setup.exe
            dist/*_portable.zip
            target/plugin-examples/cluster-tools.zip
          if-no-files-found: error
          retention-days: 90
